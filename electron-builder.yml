appId: com.focusproof.app
productName: FocusProof
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/models
    to: models
  - from: resources/win32
    to: win32
  - from: resources/icon.png
    to: icon.png
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
# Installed copies update from these releases (latest.yml); the installer is unsigned, so no publisherName.
publish:
  provider: github
  owner: nnilf
  repo: FocusProof
  # The release workflow creates the draft first and publishes it once every file is uploaded.
  releaseType: draft
