# Builds the Windows installer for a version tag and publishes it, with the latest.yml that
# installed copies read to update themselves.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # electron-builder uploads its files in parallel, and each upload creates the release if it
      # doesn't exist yet, which can leave two releases for one tag. Creating it first avoids that,
      # and as a draft, installed copies don't see it until every file is there.
      - name: Create a draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes

      - name: Build and upload the installer
        run: npx electron-builder --win --publish always

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
